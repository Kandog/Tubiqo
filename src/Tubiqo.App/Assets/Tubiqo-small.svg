  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <path d="M140 196 L222 248 C236 256 254 240 246 226 L196 146 Z" fill="#1D4ED8"/>
  <circle cx="116" cy="116" r="104" fill="url(#g)" stroke="#0B3B8C" stroke-opacity=".55" stroke-width="12"/>
  <path d="M86 64 L170 116 L86 168 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
</svg>
