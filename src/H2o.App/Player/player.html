<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The Lean Player page. It runs only h2o's own script (no YouTube script in this origin):
       YouTube's code stays inside the cross-origin embed iframe and is driven by postMessage. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>h2o</title>
  <link rel="stylesheet" href="player.css">
  <script src="player.js" defer></script>
</head>
<body>
  <p id="message" hidden></p>
</body>
</html>
